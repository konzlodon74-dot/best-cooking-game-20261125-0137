<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle &amp; Serve — a fast kitchen game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #241a12;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  html { overflow: hidden; }
  #wrap { position: relative; width: min(1280px, 100vw); margin: 0 auto; }
  canvas {
    display: block; width: 100%; height: auto;
    background: #f6e3c2; border-radius: 10px;
    box-shadow: 0 12px 48px rgba(0,0,0,.55);
    cursor: pointer;
  }
  #hint {
    color: #e8d9b8; text-align: center; font-size: 13px;
    margin-top: 10px; letter-spacing: .04em;
  }
  #hint b { color: #ffd166; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hint">Move <b>WASD / arrows</b> or <b>click</b> &nbsp;·&nbsp; Interact <b>E / Space</b> (hold to chop) &nbsp;·&nbsp; <b>M</b> mute &nbsp;·&nbsp; <b>R</b> restart</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
